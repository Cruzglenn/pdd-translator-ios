name: PinduoduoTranslatorApp
options:
  bundleIdPrefix: app.gmcdev
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1" # iPhone
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

targets:
  PinduoduoTranslatorApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    info:
      path: Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.gmcdev.pddtranslator
      INFOPLIST_FILE: Info.plist
      ENABLE_BITCODE: "NO"
