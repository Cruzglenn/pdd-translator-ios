name: Build iOS IPA (No Mac Storage Needed)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Cloud Xcode Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app || true

      - name: Build iOS Application (.app)
        run: |
          xcodebuild -project PinduoduoTranslatorApp.xcodeproj \
            -scheme PinduoduoTranslatorApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build

      - name: Package .app into .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r PinduoduoTranslator.ipa Payload
          ls -lh PinduoduoTranslator.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PinduoduoTranslator-iOS-IPA
          path: PinduoduoTranslator.ipa
          retention-days: 14
